<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Job Tracker</title>

    <!-- Tailwind + Daisy UI  -->
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Google Fonts  -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        font-family: "Geist", sans-serif;
      }
    </style>
    <!-- Font Awesome  -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <!-- Header section  -->
    <header class="w-10/12 mx-auto mt-12">
        <h1 class=" font-bold text-4xl text-[#002C5C] mb-5">Job Application Tracker</h1>
        <div class="card grid grid-cols-3 gap-4">

            <div class="bg-[#F1F2F4] p-5 rounded-lg">
                <p class="font-medium text-[20px] text-[#323B49]">Total</p>
                <p class="text-[#002C5C] font-bold">8</p>
            </div>
            <div class="bg-[#F1F2F4] p-5 rounded-lg">
                <p class="font-medium text-[20px] text-[#323B49]">Interview</p>
                <p class="text-[#10B981] font-bold">0</p>
            </div>
            <div class="bg-[#F1F2F4] p-5 rounded-lg">
                <p class="font-medium text-[20px] text-[#323B49]">Rejected</p>
                <p class="text-[#EF4444] font-bold">0</p>
            </div>
        </div>
        
    </header>

    <hr class="my-7 w-10/12 mx-auto bg-[#E6E7E9] h-px border-0">
    
  </body>
</html>
